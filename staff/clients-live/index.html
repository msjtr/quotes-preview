  app.textContent='';app.appendChild(el('div',{class:'msg'},[el('div',{class:'spin',style:'margin:0 auto'})]));
  call('/'+src+'/'+encodeURIComponent(id)).then(function(j){S.cur=j.profile;drawProfile();scrollTo(0,0);}).catch(gate);}
function drawProfile(){var P=S.cur;app.textContent='';
  app.appendChild(el('button',{class:'btn sm back',type:'button',onclick:drawList,text:'→ العودة إلى القائمة'}));
  app.appendChild(el('div',{class:'card pad ph'},[el('span',{class:'av',text:(P.name||'؟').trim().charAt(0)}),
    el('div',{style:'flex:1;min-width:0'},[el('h2',{text:P.name||'—'}),el('div',{class:'sb'},[ltr(P.no||P.id),ltr(P.email),ltr(P.phone),el('span',{},[(P.src==='mig'?'مرحّل · ':'مسجّل · ')+'أُنشئ ',ltr(d(P.at))])])]),
    stChip(P.state||P.status)]));
  var B=P.blocks||{};
  BL.forEach(function(b){if(B[b[0]]||P.src==='reg')app.appendChild(sec(b[1],null,kv(B[b[0]])));});
  Object.keys(B).filter(function(k){return !BL.some(function(b){return b[0]===k;});}).forEach(function(k){app.appendChild(sec(k,null,kv(B[k])));});
  if(P.addresses&&P.addresses.length)app.appendChild(sec('العناوين المسجّلة',P.addresses.length,el('div',{},P.addresses.map(function(a){return kv({label:a.label,line1:[a.line1,a.line2].filter(Boolean).join('، '),district:a.quarter,city:a.city,state:a.state,postal_code:a.postcode,country:a.country});}))));
  if(P.svc&&Object.keys(P.svc).length)app.appendChild(sec('بياناتي في «خدماتي»',null,kv(P.svc)));
  if(P.gaps&&Object.keys(P.gaps).length){var g=P.gaps,cnt=0;
    var body=el('div',{class:'gp'},Object.keys(g).map(function(k){var v=g[k];var arr=Array.isArray(v)?v:(v&&typeof v==='object'?Object.keys(v):[String(v)]);cnt+=arr.length;
      return el('div',{},[el('b',{text:GP[k]||k})].concat(arr.map(function(x){return chip(typeof x==='string'?(LB[x]||x):JSON.stringify(x),'warn');})));}));
    app.appendChild(sec('النواقص',cnt,body));}
  if(P.conflict)app.appendChild(sec('تعارض الهوية',null,kv(P.conflict)));
  var F=P.files||[];
  app.appendChild(sec('المرفقات',F.length,F.length?el('div',{class:'fl'},F.map(function(f){return fileRow(P,f);})):el('p',{class:'empty',text:'لا مرفقات.'})));
}
function fileRow(P,f){var ext=String(f.name||'').split('.').pop().toUpperCase().slice(0,4)||'FILE';
  var ok=P.src==='reg'||f.ready;var s=DS[f.status];
  return el('div',{class:'fi'},[el('span',{class:'ic',text:ext}),
    el('div',{style:'min-width:0'},[el('div',{class:'t',text:(DK[f.kind]||f.label||f.kind||'مرفق')+(f.side?' · '+(f.side==='front'?'الوجه':f.side==='back'?'الظهر':f.side):'')}),
      el('div',{class:'s'},[ltr(f.name),ltr(d(f.at)),f.size?ltr(n(Math.round(f.size/1024))+' KB'):null,f.place?el('span',{text:f.place==='archive'?'أرشيف':'الملف الشخصي'}):null,s?chip(s[0],s[1]):null,!ok?chip('لم يُجلب بعد','mute'):null])]),
    ok?el('button',{class:'btn sm',type:'button',onclick:function(){view(P,f);},text:'عرض'}):el('span')]);}
/* --- العارض --- */
function view(P,f){
  var bd=el('div',{class:'vw-b'},[el('div',{class:'spin'})]);
  var close=function(){if(u)URL.revokeObjectURL(u);wrap.remove();document.removeEventListener('keydown',esc);};
  var esc=function(e){if(e.key==='Escape')close();};var u=null;
  var wrap=el('div',{class:'vw',role:'dialog','aria-modal':'true','aria-label':f.name||'مرفق',onclick:function(e){if(e.target===wrap)close();}},[el('div',{class:'vw-in'},[
    el('div',{class:'vw-h'},[el('b',{text:f.name||'مرفق'}),chip('للاطلاع فقط','info'),el('button',{class:'icb',type:'button','aria-label':'إغلاق',onclick:close,text:'✕'})]),bd])]);
  document.body.appendChild(wrap);document.addEventListener('keydown',esc);
  var show=function(src,mime){bd.textContent='';var isImg=/^image\//.test(mime||'')||/\.(png|jpe?g|webp|gif)$/i.test(f.name||'');
    bd.appendChild(isImg?el('img',{src:src,alt:f.name||''}):el('iframe',{src:src,title:f.name||'مرفق'}));};
  var path='/'+P.src+'/'+encodeURIComponent(P.id)+'/files/'+encodeURIComponent(f.fid);
  if(P.src==='reg'){call(path).then(function(j){show(j.url,f.mime);}).catch(function(e){bd.textContent=(e&&e.msg)||'تعذّر فتح المرفق.';});}
  else{call(path,true).then(function(r){var m=r.headers.get('content-type');return r.blob().then(function(b){u=URL.createObjectURL(b);show(u,m);});}).catch(function(e){bd.textContent=(e&&e.msg)||'تعذّر فتح المرفق.';});}
}
function boot(){app.textContent='';app.appendChild(el('div',{class:'msg'},[el('div',{class:'spin',style:'margin:0 auto'})]));
  call('').then(function(j){S.list=j;S.can=j.can||{};drawList();}).catch(gate);}
boot();
})();
