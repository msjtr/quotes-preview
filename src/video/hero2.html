<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Alx;src:url(fonts/alexandria-arabic-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Alx;src:url(fonts/alexandria-arabic-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Alx;src:url(fonts/alexandria-latin-800-normal.woff2) format("woff2");font-weight:800;unicode-range:U+0000-00FF}
@font-face{font-family:Alx;src:url(fonts/alexandria-latin-700-normal.woff2) format("woff2");font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");font-weight:600}
html,body{margin:0;width:var(--W);height:var(--H);overflow:hidden;background:#0B2552}
#v{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:Alx,sans-serif;color:#fff;background:linear-gradient(125deg,#0B2552 0%,#0F3B78 45%,#0A7F8C 85%,#0AA5AD 115%)}
#aur{position:absolute;inset:-30%;background:conic-gradient(from 200deg at 55% 45%,transparent 0deg,rgba(99,226,224,.22) 40deg,transparent 95deg,rgba(255,200,97,.18) 150deg,transparent 215deg);filter:blur(34px);mix-blend-mode:screen}
.glow{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(14px)}
#ga{background:radial-gradient(circle,rgba(25,194,190,.7),transparent 66%)}
#gb{background:radial-gradient(circle,rgba(255,176,64,.48),transparent 68%)}
#grid,#gridHi,#nodes{position:absolute;inset:0;background-size:48px 48px}
#grid{background-image:linear-gradient(rgba(186,232,255,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(186,232,255,.17) 1px,transparent 1px);-webkit-mask-image:radial-gradient(115% 100% at 50% 50%,rgba(0,0,0,.62) 22%,#000 72%)}
#gridHi{background-image:linear-gradient(rgba(255,222,150,.75) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,236,.75) 1px,transparent 1px)}
#nodes{background-image:radial-gradient(circle at 50% 50%,rgba(255,226,160,.85) 1.6px,transparent 2.4px);background-position:-24px -24px;opacity:.5;-webkit-mask-image:radial-gradient(115% 100% at 50% 50%,rgba(0,0,0,.35) 25%,#000 75%)}
#cells{position:absolute;inset:0}
.cell{position:absolute;width:47px;height:47px;border-radius:2px}
.cell.t{background:linear-gradient(135deg,rgba(99,226,224,.55),rgba(10,165,173,.18));box-shadow:inset 0 0 0 1px rgba(160,250,245,.9),0 0 22px rgba(25,194,190,.65)}
.cell.g{background:linear-gradient(135deg,rgba(255,214,130,.5),rgba(240,150,42,.14));box-shadow:inset 0 0 0 1px rgba(255,226,160,.95),0 0 22px rgba(255,176,64,.6)}
#ring,#ring2{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;border:1.5px solid rgba(255,200,97,.6);box-shadow:0 0 50px rgba(10,165,173,.3)}
#ring2{border-color:rgba(99,226,224,.5);border-style:dashed}
.lay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 60px}
.gold{background:linear-gradient(100deg,#FFE7B0 0%,#FFC861 40%,#FFF4D8 70%,#FFC861 100%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%}
.w{display:inline-block;padding:.12em .08em}
.logo{height:140px;filter:drop-shadow(0 0 30px rgba(10,165,173,.6))}
.big{font-weight:800;font-size:60px;line-height:1.45;white-space:nowrap;padding:.06em .1em}
.mid{font-weight:700;font-size:52px;line-height:1.3;color:#fff}
.kick{font:700 22px Alx;color:#FFC861;padding:8px 22px;border-radius:99px;border:1.5px solid rgba(255,200,97,.55);background:rgba(10,31,68,.45)}
.subl{font:600 24px/1.6 Plex;color:#E4EEFA}
.cards{position:relative;width:900px;height:270px}
.card{position:absolute;left:50%;top:0;width:220px;height:250px;margin-left:-110px;background:#fff;border-radius:24px;box-shadow:0 24px 50px rgba(0,0,0,.4);overflow:hidden}
.card img{display:block;width:100%;height:190px;object-fit:contain;padding:8px;box-sizing:border-box;background:#fff}
.card b{display:block;font:700 15px Alx;color:#0A1F44;padding:10px 14px 0;text-align:right}
.card small{display:block;font:700 13px Alx;color:#12795C;padding:4px 14px;text-align:right}
.path{position:relative;width:1060px;height:240px}
.line{position:absolute;left:120px;right:120px;top:62px;height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
.lineF{position:absolute;right:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(270deg,#19C2AE,#FFC861);box-shadow:0 0 18px rgba(255,200,97,.8)}
.st{position:absolute;top:0;width:240px;margin-right:-120px;display:flex;flex-direction:column;align-items:center;gap:12px}
.st svg{width:116px;height:130px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
.st div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.st b{font:800 25px/1.35 Alx;white-space:nowrap}
.st span{font:600 17px/1.5 Plex;color:#DCE7F5}
.tags{font:700 26px Alx;color:#E8EFFA;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.tags em{font-style:normal;color:#FFC861}
#f2{font:800 32px/1.4 Alx;color:#fff;padding:8px 26px;border-radius:99px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);text-shadow:0 2px 12px rgba(0,0,0,.35)}
#f3 span{font:700 22px Alx;color:#0A1F44;background:linear-gradient(135deg,#FFE1A0,#FFC861 45%,#F0962A);padding:8px 18px;border-radius:99px}
#f3 i{display:none}
#vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 50%,transparent 62%,rgba(3,10,26,.3));pointer-events:none}
/* mobile 4:5 */
.m .big{font-size:52px}.m .mid{font-size:50px}.m .subl{font-size:26px}
.m .cards{width:640px;height:520px}
.m .path{width:620px;height:640px}
.m .line{right:auto;top:70px;bottom:90px;left:518px;width:4px;height:auto}
.m .lineF{right:auto;left:0;width:100%;bottom:auto}
.m .st{flex-direction:row;width:520px;margin:0;right:50px !important;gap:20px;text-align:right;align-items:center}
.m .st svg{width:100px;height:112px;flex:none}
.m .st div{align-items:flex-start;text-align:right;gap:4px}
.m .tags{flex-direction:row;gap:10px;max-width:600px}
.m #f2{font-size:34px}
.m #f3 span{font-size:24px}
.m .tags i{display:none}
</style></head><body>
<div id="v">
  <div id="aur"></div><div class="glow" id="ga"></div><div class="glow" id="gb"></div><div id="grid"></div><div id="gridHi"></div><div id="nodes"></div><div id="cells"></div><div id="ring"></div><div id="ring2"></div>
  <div class="lay" id="s1"><img class="logo" id="lg1" src="logo-white.png"><div class="big gold" id="t1"></div></div>
  <div class="lay" id="s2"><div class="kick">فلسفة تيرا</div><div class="mid" id="l1"></div><div class="big gold" id="l2"></div></div>
  <div class="lay" id="s3"><div class="kick">منتجات جاهزة</div><div class="mid" id="l3"></div><div class="cards" id="cards"></div></div>
  <div class="lay" id="s4"><div class="kick">حسب الطلب</div><div class="mid" id="l4" style="font-size:44px"></div><div class="path" id="path"><div class="line"><div class="lineF" id="lineF"></div></div></div></div>
  <div class="lay" id="s5"><img class="logo" id="lg2" src="logo-white.png" style="height:118px"><div class="big gold" id="f1">من الاحتياج إلى الحل</div><div class="subl" id="f2">منصة تيرا للخدمات المتكاملة</div><div class="tags" id="f3"><span>منتجات جاهزة</span><i><em>•</em></i><span>حسب الطلب</span><i><em>•</em></i><span>متابعة حتى الحل</span></div></div>
  <div id="vig"></div>
</div>
<script>
const I=window.ICON, M=window.LAY==='m';
if(M) document.body.classList.add('m');
const W=M?720:1280, H=M?900:540;
document.documentElement.style.setProperty('--W',W+'px');document.documentElement.style.setProperty('--H',H+'px');
const TONES={teal:['#06707A','#63E2E0','#0AA5AD'],saffron:['#B9690F','#FFD27A','#F0962A'],sky:['#1B5F93','#A4E0F8','#2E8FD0'],gold:['#C98418','#FFE7A8','#F2B64A']};
function tile(tone,icon,id){const t=TONES[tone],p=I[icon];return `<svg viewBox="0 0 100 112"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t[1]}"/><stop offset="1" stop-color="${t[2]}"/></linearGradient><clipPath id="c${id}"><rect x="10" y="7" width="80" height="80" rx="25"/></clipPath></defs><ellipse cx="50" cy="101" rx="38" ry="8" fill="#000" opacity=".25"/><rect x="10" y="17" width="80" height="80" rx="25" fill="${t[0]}"/><rect x="10" y="7" width="80" height="80" rx="25" fill="url(#g${id})"/><g clip-path="url(#c${id})"><ellipse cx="34" cy="14" rx="58" ry="30" fill="#fff" opacity=".2"/></g><g transform="translate(29.5,28) scale(0.171875)" fill="${t[0]}" opacity=".55"><path d="${p}"/></g><g transform="translate(28,25) scale(0.171875)" fill="#fff"><path d="${p}"/></g></svg>`}
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7), COLS=Math.ceil(W/48), ROWS=Math.ceil(H/48), CELLS=[];
for(let i=0;i<(M?30:34);i++){const c=document.createElement('div'); const x=Math.floor(R()*COLS), y=Math.floor(R()*ROWS);
  c.className='cell '+(R()<.62?'t':'g'); c.style.left=(x*48+1)+'px'; c.style.top=(y*48+1)+'px'; $('cells').appendChild(c);
  CELLS.push({el:c,ph:R()*18,len:1.6+R()*1.8,cx:x*48-W/2,cy:y*48-H/2});}
const STEPS=[['طلب العميل','تكتب احتياجك ومواصفاتك','teal','PiFileTextFill'],['الدراسة والبحث','نفهم الطلب ونبحث في الخيارات','sky','PiEyeFill'],['التنسيق والخيارات','مع الموردين ومقدمي الخدمات','saffron','PiChatsCircleFill'],['الحل المناسب','تختار ما يناسب احتياجك','gold','PiSparkleFill']];
STEPS.forEach((s,i)=>{const d=document.createElement('div');d.className='st';d.id='st'+i;
  if(M){ d.style.top=(20+i*150)+'px'; } else d.style.right='calc(120px + '+i+' * (100% - 240px) / 3)';
  d.innerHTML=tile(s[2],s[3],i)+`<div><b>${s[0]}</b><span>${s[1]}</span></div>`;$('path').appendChild(d)});
const CARDS=[['hi-XMI-17U.jpg','Xiaomi · جوالات'],['hi-TERA-PKG-01.jpg','باقات المتاجر الإلكترونية'],['hi-APL-IP18PM.jpg','Apple · جوالات'],['hi-TERA-DSN-12.jpg','تصميم المتجر'],['hi-HUA-GT7P.jpg','HUAWEI · ساعات']];
CARDS.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.id='cd'+i;d.innerHTML=`<img src="prod/${c[0]}"><b>${c[1]}</b><small>جاهز للطلب</small>`;$('cards').appendChild(d)});
function words(el,text){const g=el.classList.contains('gold'); if(g) el.classList.remove('gold'); el.innerHTML=text.split(' ').map(w=>`<span class="w${g?' gold':''}">${w}</span>`).join(' ');return [...el.querySelectorAll('.w')]}
const W1=words($('t1'),'من الاحتياج إلى الحل'), W2=words($('l1'),'لا نبدأ من المنتج،'), W3=words($('l2'),'بل نبدأ من الاحتياج'), W4=words($('l3'),'لمن يعرف ما يريد: اطلب مباشرة'), W5=words($('l4'),'ولمن لديه احتياج خاص: نبحث معه عن الحل');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>1-Math.pow(1-cl(x),3), inout=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, seg=(t,a,b)=>cl((t-a)/(b-a));
function wordsAt(ws,t,start,step){ws.forEach((w,i)=>{const k=ease(seg(t,start+i*step,start+i*step+.55));w.style.opacity=k;w.style.transform=`translateY(${(1-k)*22}px)`;w.style.filter=`blur(${(1-k)*8}px)`})}
function scene(id,t,a,b){const i=ease(seg(t,a,a+.5)), o=inout(seg(t,b-.5,b)); $(id).style.opacity=i*(1-o); $(id).style.transform=`translateY(${-o*30}px)`; return i}
const D=18;
window.render=function(t){
  const a=t/D*Math.PI*2;
  $('aur').style.transform=`rotate(${t/D*360}deg)`;
  $('ga').style.transform=`translate(${(M?-200:-120)+Math.sin(a)*120}px,${-160+Math.cos(a)*60}px)`;
  $('gb').style.transform=`translate(${(M?300:760)+Math.cos(a)*110}px,${(M?520:260)+Math.sin(a)*70}px)`;
  { // شبكة المربعات: خطوط ثابتة حادّة + خلايا مضيئة + موجة ضوء
  const sw=((t/D)*1.6%1)*170-35; const m=`linear-gradient(110deg,transparent ${sw-14}%,#000 ${sw}%,transparent ${sw+14}%)`;
  $('gridHi').style.webkitMaskImage=m; $('gridHi').style.opacity=.55;
  CELLS.forEach(c=>{ let u=((t-c.ph)%D+D)%D/c.len; let k=u<1?Math.sin(u*Math.PI):0; k=k*k*(3-2*k);
    const d=Math.hypot(c.cx,c.cy)/Math.hypot(W/2,H/2); c.el.style.opacity=(k*(.62+.38*d)).toFixed(3); });
  $('nodes').style.opacity=(.42+.12*Math.sin(t/D*Math.PI*4)).toFixed(3); }
  const pulse=1+Math.sin(a*3)*.05; $('ring').style.transform=`scale(${pulse})`; $('ring2').style.transform=`scale(${1.25/pulse}) rotate(${t/D*90}deg)`;
  const r1=scene('s1',t,.0,3.4); $('lg1').style.transform=`scale(${.82+.18*r1})`; wordsAt(W1,t,.9,.22); W1.forEach(w=>w.style.backgroundPosition=`${120-t*30}% 0`);
  scene('s2',t,3.4,6.9); wordsAt(W2,t,3.6,.2); wordsAt(W3,t,4.6,.24); W3.forEach(w=>w.style.backgroundPosition=`${160-t*25}% 0`);
  scene('s3',t,6.9,10.9); wordsAt(W4,t,7.1,.16);
  CARDS.forEach((c,i)=>{const k=ease(seg(t,7.6+i*.22,8.3+i*.22)), off=i-2; const el=$('cd'+i);
    const x=M?(off%2?0:0):off*175, y=M?Math.abs(off)*0:Math.abs(off)*18;
    if(M){ const col=i%3, row=Math.floor(i/3); const mx=[-210,0,210][col]+(row?105:0), my=row*262; el.style.transform=`translate(${mx}px,${my+(1-k)*50}px) scale(${.82})`; }
    else el.style.transform=`translate(${x*k}px,${y+(1-k)*60+Math.sin(t*2+i)*4}px) rotate(${off*5*k}deg) scale(${(off===0?1:.9)})`;
    el.style.opacity=k; el.style.zIndex=10-Math.abs(off)});
  scene('s4',t,10.9,14.8); wordsAt(W5,t,11.1,.14);
  const lf=inout(seg(t,11.6,14.0)); if(M){$('lineF').style.height=(lf*100)+'%';$('lineF').style.width='100%'} else $('lineF').style.width=(lf*100)+'%';
  STEPS.forEach((s,i)=>{const k=ease(seg(t,11.7+i*.55,12.3+i*.55)); const el=$('st'+i); el.style.opacity=.15+.85*k; el.style.transform=`translateY(${(1-k)*26}px) scale(${.88+.12*k})`});
  const r5=ease(seg(t,14.8,15.4)); $('s5').style.opacity=r5*(1-inout(seg(t,D-.45,D))); $('lg2').style.transform=`scale(${.9+.1*r5})`; $('f1').style.backgroundPosition=`${200-t*20}% 0`;
  $('f2').style.opacity=ease(seg(t,15.3,15.9)); $('f3').style.opacity=ease(seg(t,15.8,16.4));
};
</script></body></html>
