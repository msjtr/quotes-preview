<style>

.tb{position:absolute;left:300px;top:352px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;white-space:nowrap}

.stp{position:absolute;left:300px;top:470px;transform:translateX(-50%);display:none}

/* mobile square layout */
.m #tx{right:52px;left:52px;top:56px;bottom:auto;width:auto;gap:14px}

</style></head><body>
<div id="v">
  <div id="aur"></div><div class="glow" id="ga"></div><div class="glow" id="gb"></div><div id="dots"></div><div id="arc"></div><div id="arc2"></div>
  <div id="ct"><div id="vis"></div>
  <div id="tx"><div id="kick"></div><div id="tt"></div><div id="st"></div><div id="chips"></div></div></div>
  <div id="vig"></div>
</div>
<script>
const S=window.SPEC, I=window.ICON, M=window.LAY==='m';
if(M) document.body.classList.add('m');
document.documentElement.style.setProperty('--W',M?'720px':'1280px');document.documentElement.style.setProperty('--H',M?'720px':'480px');
const TONES={teal:['#06707A','#63E2E0','#0AA5AD'],saffron:['#B9690F','#FFD27A','#F0962A'],sky:['#1B5F93','#A4E0F8','#2E8FD0'],navy:['#0B2349','#6C8FDC','#1D3F86'],gold:['#C98418','#FFE7A8','#F2B64A']};
let tid=0;
function tile(tone,icon){const t=TONES[tone],id=tid++,p=I[icon];return `<svg viewBox="0 0 100 112" class="tile"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t[1]}"/><stop offset="1" stop-color="${t[2]}"/></linearGradient><linearGradient id="r${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c${id}"><rect x="10" y="7" width="80" height="80" rx="25"/></clipPath></defs><ellipse cx="50" cy="101" rx="38" ry="8" fill="#000" opacity=".25"/><rect x="10" y="17" width="80" height="80" rx="25" fill="${t[0]}"/><rect x="10" y="7" width="80" height="80" rx="25" fill="url(#g${id})"/><g clip-path="url(#c${id})"><ellipse cx="34" cy="14" rx="58" ry="30" fill="#fff" opacity=".2"/></g><rect x="11.5" y="8.5" width="77" height="77" rx="23.5" fill="none" stroke="url(#r${id})" stroke-width="2"/><g transform="translate(29.5,28) scale(0.171875)" fill="${t[0]}" opacity=".55"><path d="${p}"/></g><g transform="translate(28,25) scale(0.171875)" fill="#fff"><path d="${p}"/></g></svg>`}
const $=id=>document.getElementById(id), vis=$('vis');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>1-Math.pow(1-cl(x),3), inout=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, seg=(t,a,b)=>cl((t-a)/(b-a));
function words(el,text){el.innerHTML=text.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');return [...el.querySelectorAll('.w')]}
function wordsAt(ws,t,start,step){ws.forEach((w,i)=>{const k=ease(seg(t,start+i*step,start+i*step+.5));w.style.opacity=k;w.style.transform=`translateY(${(1-k)*18}px)`;w.style.filter=`blur(${(1-k)*6}px)`})}
$('kick').textContent=S.kick; const WT=words($('tt'),S.title); $('tt').querySelectorAll('.w').forEach((w,i)=>{ if(S.gold && i>=S.gold) w.classList.add('gold') });
$('st').textContent=S.sub; $('chips').innerHTML=(S.chips||[]).map(c=>`<i>${c}</i>`).join('');
const D=S.dur||10, el={};
function add(html){const d=document.createElement('div');d.innerHTML=html;const n=d.firstElementChild;vis.appendChild(n);return n}
// ---------- build visuals ----------
const B={
 about(){ el.c=add(`<div class="node" style="left:300px;top:240px">${tile('teal','PiCompassFill')}</div>`); el.c.querySelector('svg').style.cssText='position:static;width:150px;height:168px';
   el.p=(S.items||[]).map((x,i)=>add(`<div class="pill">${x}</div>`)); },
 flow(){ el.line=add(`<div style="position:absolute;left:70px;right:70px;top:226px;height:4px;border-radius:4px;background:rgba(255,255,255,.14)"><div style="position:absolute;right:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(270deg,#19C2AE,#FFC861);box-shadow:0 0 16px rgba(255,200,97,.8)"></div></div>`);
   el.s=S.items.map((x,i)=>{const n=add(`<div class="node" style="left:${530-i*153}px;top:250px">${tile(x[1],x[2])}<b>${x[0]}</b></div>`); n.querySelector('svg').style.cssText='position:static;width:92px;height:103px;filter:drop-shadow(0 14px 16px rgba(0,0,0,.35))'; return n}); },
 products(){ el.cards=S.items.map((src,i)=>add(`<div class="card" style="width:230px;height:230px"><img src="prod/${src}"><span class="badge">${S.badge||'الأكثر طلبًا'}</span></div>`)); },
 network(){ el.w=add(`<svg class="wires" viewBox="0 0 600 480"></svg>`);
   el.c=add(`<div class="node" style="left:300px;top:240px">${tile('teal','PiHandshakeFill')}<b>تيرا</b></div>`); el.c.querySelector('svg').style.cssText='position:static;width:120px;height:134px';
   const pos=[[110,110],[490,110],[110,380],[490,380]];
   el.n=S.items.map((x,i)=>{const n=add(`<div class="node" style="left:${pos[i][0]}px;top:${pos[i][1]}px">${tile(x[1],x[2])}<b>${x[0]}</b></div>`); n.querySelector('svg').style.cssText='position:static;width:78px;height:87px'; return n});
   el.w.innerHTML=pos.map((p,i)=>`<line id="ln${i}" x1="300" y1="240" x2="${p[0]}" y2="${p[1]}" stroke="#FFC861" stroke-width="2.5" stroke-dasharray="6 8" opacity=".8"/><circle id="dt${i}" r="6" fill="#63E2E0"/>`).join(''); el.pos=pos; },
 help(){ el.card=add(`<div class="glass" style="left:60px;top:70px;width:480px;height:340px"></div>`);
   el.ref=add(`<div style="position:absolute;left:90px;top:96px;font:800 22px Alx;color:#FFC861;direction:ltr">#TERA-104527</div>`);
   el.steps=add(`<div class="steps" style="left:90px;top:140px">${S.items.map(x=>`<i>${x}</i>`).join('')}</div>`);
   el.b1=add(`<div class="bub a" style="right:90px;top:200px">${S.q}</div>`); el.b2=add(`<div class="bub b" style="left:90px;top:290px">${S.a}</div>`); },
 docs(){ el.d=S.items.map((x,i)=>add(`<div class="doc" style="left:${70+i*150}px;top:${120+(i%2)*30}px"><b>${x}</b><i></i><i style="width:80%"></i><i></i><i style="width:60%"></i><i style="width:90%"></i><span class="ck"><svg viewBox="0 0 256 256" width="24" height="24" fill="#fff"><path d="${I.PiCheckCircleFill}"/></svg></span></div>`)); },
 tiers(){ const T=[['plus','TERRA PLUS','عضوية تيرا بلس','Terra Plus'],['prem','TERRA PREMIUM','عضوية تيرا بريميوم','Terra Premium'],['elite','TERRA ELITE','عضوية تيرا إيليت','Terra Elite']];
   el.m=T.map(x=>add(`<div class="mc ${x[0]}"><img class="lg" src="logo-white.png"><div class="wm">${x[1]}</div><div class="ar">${x[2]}</div><div class="nm">${x[3]}</div><div class="mb">MEMBER</div><span class="tg">ACTIVE · نشطة</span><span class="sh"></span></div>`));
   el.ps=add(`<div class="psteps"><i>اطلب واكسب</i><i>استبدل نقاطك</i><i>ارتقِ لمستوى أعلى</i></div>`); },
 faq(){ el.a=S.items.map((x,i)=>{const n=add(`<div class="acc" style="top:${70+i*92}px"><div class="h">${tile(x[1],x[2])}<span>${x[0]}</span><span class="ch"></span></div><div class="b"><i></i><i style="width:85%"></i><i style="width:60%"></i></div></div>`); n.querySelector('svg').classList.remove('tile'); return n}); },
