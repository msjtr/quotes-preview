<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Alx;src:url(../fonts/alexandria-arabic-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Alx;src:url(../fonts/alexandria-arabic-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Alx;src:url(../fonts/alexandria-latin-700-normal.woff2) format("woff2");font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:Plex;src:url(../fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");font-weight:600}
html,body{margin:0}
#v{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Alx,sans-serif;color:#fff;background:linear-gradient(125deg,#0B2552 0%,#0F3B78 48%,#0A7F8C 100%)}
.g1,.g2{position:absolute;border-radius:50%;filter:blur(20px)}
.g1{width:760px;height:760px;left:-300px;bottom:-420px;background:radial-gradient(circle,rgba(25,194,190,.55),transparent 66%)}
.g2{width:700px;height:700px;right:-260px;top:-380px;background:radial-gradient(circle,rgba(255,176,64,.38),transparent 68%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,214,140,.6) 1.3px,transparent 1.5px);background-size:30px 30px;opacity:.12}
.ring{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.r1{width:560px;height:560px;border:2px solid rgba(255,200,97,.45);box-shadow:0 0 60px rgba(10,165,173,.3)}
.r2{width:700px;height:700px;border:2px dashed rgba(99,226,224,.35)}
.r3{width:860px;height:860px;border:2px dotted rgba(255,255,255,.14)}
.lay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.logo{position:relative;width:440px;height:194.6px;filter:drop-shadow(0 0 26px rgba(10,165,173,.55))}
.logo img{position:absolute;inset:0;width:100%;height:100%}
h1{margin:6px 0 0;font-weight:800;font-size:66px;line-height:1.45;padding:0 .1em;white-space:nowrap;background:linear-gradient(100deg,#FFE7B0 0%,#FFC861 40%,#FFF4D8 70%,#FFC861 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:700 28px Alx;color:#fff;padding:8px 26px;border-radius:99px;border:1.5px solid rgba(255,255,255,.28);background:rgba(10,31,68,.35)}
.tags{display:flex;gap:12px}.tags span{font:700 21px Alx;color:#3D2403;padding:7px 18px;border-radius:99px;background:linear-gradient(180deg,#FFE1A0,#F0A23A)}
</style></head><body><div id="v"><i class="g1"></i><i class="g2"></i><i class="dots"></i><i class="ring r3"></i><i class="ring r2"></i><i class="ring r1"></i>
<div class="lay"><div class="logo"><img src="sym.png"><img src="tera.png"><img src="ar.png"><img src="lines.png"><img src="tagtx.png"><img src="en.png"></div>
<h1>من الاحتياج إلى الحل</h1><div class="sub">منصة تيرا للخدمات المتكاملة</div>
<div class="tags"><span>منتجات جاهزة</span><span>حسب الطلب</span><span>متابعة حتى الحل</span></div></div></div></body></html>
