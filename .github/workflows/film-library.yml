# مكتبة أفلام التدشين في «إعدادات تدشين الحساب» — تُرفع إلى Cloudflare R2 (المسار library/ بلا مدة):
# الفيلم الجديد أفقي وطولي · الفيلم المرجعي (3 دقائق) · فيلم الصفحة الرئيسية القديم بنسختيه · الأفلام العامة.
# المصدر: إصدار مؤقت باسم film-library (أجزاء + manifest.sha256)، ويُحذف بعد الرفع — لا شيء من الفيديو في شجرة المستودع.
# لكل فيلم نسختان بالملف نفسه: library/<اسم>.mp4 للتحميل (attachment) · library/view/<اسم>.mp4 للمشاهدة المباشرة في المتصفح (inline).
# الوضع view: ينسخ أفلام library/ الموجودة إلى library/view/ داخل R2 مباشرة، بلا إصدار مؤقت.
name: film-library
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload = الرفع من الإصدار المؤقت · view = نسخ المشاهدة المباشرة للأفلام الموجودة'
        type: choice
        default: upload
        options: [upload, view]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      MODE: ${{ inputs.mode || 'upload' }}
    steps:
      - uses: actions/checkout@v4
      - name: جلب الملفات من الإصدار المؤقت
        if: env.MODE == 'upload'
        run: mkdir -p "$RUNNER_TEMP/src" && gh release download film-library -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/src"
      - name: تجميع الأجزاء والتحقق من سلامتها
        if: env.MODE == 'upload'
        run: |
          cd "$RUNNER_TEMP/src"
          for b in $(ls *.part* | sed 's/\.part[0-9]*$//' | sort -u); do cat $(ls "$b".part* | sort -V) > "$b"; rm "$b".part*; done
          sha256sum -c manifest.sha256
      - name: فيلم الصفحة الرئيسية القديم (إن بقي في المستودع؛ نسخته محفوظة في library/home-old-*)
        if: env.MODE == 'upload'
        run: |
          [ -f assets/vid/film.mp4 ] && cp assets/vid/film.mp4 "$RUNNER_TEMP/src/home-old-landscape.mp4" || true
          [ -f assets/vid/film-m.mp4 ] && cp assets/vid/film-m.mp4 "$RUNNER_TEMP/src/home-old-portrait.mp4" || true
          [ -f assets/vid/film-poster.jpg ] && cp assets/vid/film-poster.jpg "$RUNNER_TEMP/src/home-old-landscape.jpg" || true
          [ -f assets/vid/film-poster-m.jpg ] && cp assets/vid/film-poster-m.jpg "$RUNNER_TEMP/src/home-old-portrait.jpg" || true
      - name: الرفع إلى Cloudflare R2 (تحميل + مشاهدة مباشرة)
        if: env.MODE == 'upload'
        run: |
          t() { printf %s "$1" | tr -d '[:space:]'; }  # الأسرار قد تُحفظ بسطر زائد
          export AWS_ACCESS_KEY_ID="$(t "$AWS_ACCESS_KEY_ID")" AWS_SECRET_ACCESS_KEY="$(t "$AWS_SECRET_ACCESS_KEY")"
          R2ID="$(t "$R2_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n 1)"  # يقبل الرقم وحده أو رابط S3 كاملًا
          [ -n "$R2ID" ] || { echo "R2_ACCOUNT_ID غير صالح"; exit 1; }
          EP="https://$R2ID.r2.cloudflarestorage.com"
          for f in "$RUNNER_TEMP"/src/*.mp4 "$RUNNER_TEMP"/src/*.jpg; do n=$(basename "$f")
            case "$n" in (*.mp4) T=video/mp4;; (*) T=image/jpeg;; esac
            aws s3 cp "$f" "s3://tera-films/library/$n" --endpoint-url "$EP" --content-type "$T" --content-disposition "attachment; filename=\"TERA-$n\"" --cache-control "public, max-age=604800" --only-show-errors; echo "uploaded library/$n"
            case "$n" in (*.mp4)
              aws s3 cp "$f" "s3://tera-films/library/view/$n" --endpoint-url "$EP" --content-type video/mp4 --content-disposition "inline; filename=\"TERA-$n\"" --cache-control "public, max-age=604800" --only-show-errors; echo "uploaded library/view/$n";;
            esac; done
      - name: نسخ المشاهدة المباشرة للأفلام الموجودة في library/
        if: env.MODE == 'view'
        run: |
          t() { printf %s "$1" | tr -d '[:space:]'; }  # الأسرار قد تُحفظ بسطر زائد
          export AWS_ACCESS_KEY_ID="$(t "$AWS_ACCESS_KEY_ID")" AWS_SECRET_ACCESS_KEY="$(t "$AWS_SECRET_ACCESS_KEY")"
          R2ID="$(t "$R2_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n 1)"  # يقبل الرقم وحده أو رابط S3 كاملًا
          [ -n "$R2ID" ] || { echo "R2_ACCOUNT_ID غير صالح"; exit 1; }
          EP="https://$R2ID.r2.cloudflarestorage.com"
          for n in $(aws s3 ls "s3://tera-films/library/" --endpoint-url "$EP" | awk '{print $4}' | grep '\.mp4$'); do
            aws s3 cp "s3://tera-films/library/$n" "s3://tera-films/library/view/$n" --endpoint-url "$EP" --metadata-directive REPLACE --content-type video/mp4 --content-disposition "inline; filename=\"TERA-$n\"" --cache-control "public, max-age=604800" --only-show-errors; echo "view library/view/$n"; done
      - name: حذف الإصدار المؤقت
        if: env.MODE == 'upload'
        run: gh release delete film-library -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
