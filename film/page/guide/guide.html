<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>دليل تيرا — فيديو</title>
<link rel="stylesheet" href="/__fonts/fonts.css">
<script src="/a/js/qrcode-1.4.4.js"></script>
<style>
/* فيديوهات «دليل تيرا» v3 — تصميم مستقل لكل اتجاه (أفقي 1920×1080 · طولي 1080×1920):
   • بلا أي إطار: لا صور شاشات جوال ولا حواف أجهزة — كل العناصر مبنية بقوالب المنصة (بطاقات، حقول، أزرار، رمز QR حقيقي).
   • منطقة آمنة للشعار: لا يدخلها أي عنصر؛ كل مشهد له «مسرح» ثابت تحت النص (طولي) أو بجانبه (أفقي).
   • عنصر واحد في المسرح كل مرة (يدخل ثم يخرج قبل التالي) — لا تداخل ولا ظهور عشوائي، ولا حركة كاميرا.
   • الأحجام بمتغيّرات لكل اتجاه حتى تُقرأ الكتابة على الجوال وعلى شاشة الويب الكاملة.
   كل الحركة CSS متوقفة؛ render(t) يضبط زمن كل حركة على زمن الفيلم — تصوير لقطة بلقطة، مع خط زمن للمؤثرات (window.sfx). */
:root{--navy:#0B2552;--teal:#0AA5AD;--teal2:#06707A;--mint:#63E2E0;--gold:#FFC861;--bg:#F4F7FA;--line:#D4DEEA;--ink:#0A1F44;--ink2:#132E5E;--muted:#566A88;--ok:#12795C;--bad:#B3261E;--wa:#075E54}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
*,*::before,*::after{animation-play-state:paused!important}
bdi{unicode-bidi:isolate;white-space:nowrap;direction:ltr}
/* ---------- مقاييس كل اتجاه ---------- */
body{font-family:"IBM Plex Sans Arabic","Alexandria",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  --u:1vw;                       /* أفقي: 19.2px */
  --cw:calc(var(--u)*46); --pad:calc(var(--u)*2.6); --gap:calc(var(--u)*1.5); --r:calc(var(--u)*2.2);
  --fh:calc(var(--u)*2.3); --fb:calc(var(--u)*1.8); --fs:calc(var(--u)*1.4); --fi:calc(var(--u)*2.7); --ic:calc(var(--u)*5.4);
  --h2:calc(var(--u)*4.6); --lead:calc(var(--u)*1.95)}
.p body{--u:1vw;                 /* طولي: 10.8px */
  --cw:calc(var(--u)*88); --pad:calc(var(--u)*4.8); --gap:calc(var(--u)*2.8); --r:calc(var(--u)*4.4);
  --fh:calc(var(--u)*4.7); --fb:calc(var(--u)*3.8); --fs:calc(var(--u)*3); --fi:calc(var(--u)*5.6); --ic:calc(var(--u)*11);
  --h2:calc(var(--u)*8.6); --lead:calc(var(--u)*3.8)}
/* ---------- الخلفية بهوية المنصة ---------- */
.bg{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(calc(var(--u)*7));opacity:.55}
.bg .b1{width:48vmax;height:48vmax;left:-14vmax;top:-18vmax;background:#BFEFF1;animation:dr1 50s linear 0s both}
.bg .b2{width:42vmax;height:42vmax;right:-16vmax;bottom:-20vmax;background:#D7E3F7;animation:dr2 50s linear 0s both}
.bg .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(11,37,82,.07) 1.2px,transparent 1.3px);background-size:calc(var(--u)*2.4) calc(var(--u)*2.4);mask:linear-gradient(180deg,#000,transparent 70%)}
@keyframes dr1{to{transform:translate(10vmax,8vmax) scale(1.1)}}
@keyframes dr2{to{transform:translate(-8vmax,-6vmax) scale(1.15)}}
/* الشريط العلوي (منطقة آمنة) */
.top{position:fixed;z-index:20;top:calc(var(--u)*2.4);right:calc(var(--u)*4);left:calc(var(--u)*4);display:flex;align-items:center;justify-content:space-between;opacity:0;animation:fadeIn .6s ease var(--t0) both,fadeOut .3s ease var(--t1,999s) forwards}
.top img{height:calc(var(--u)*5)}.p .top img{height:calc(var(--u)*8.4)}
.top .tg{padding:calc(var(--u)*.55) calc(var(--u)*1.4);border-radius:999px;background:#fff;border:1px solid var(--line);font:800 calc(var(--u)*1.35) "Alexandria";color:var(--teal2)}
.p .top .tg{font-size:calc(var(--u)*2.7);padding:calc(var(--u)*1) calc(var(--u)*2.4)}
.prog{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--u)*.5);background:rgba(10,31,68,.08)}
.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));transform-origin:right;animation:prog var(--T) linear 0s both}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*2))}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(calc(var(--u)*-6))}to{opacity:1;transform:none}}
/* ---------- المشهد: نص + مسرح ---------- */
.sc{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:calc(var(--u)*4);padding:calc(var(--u)*11) calc(var(--u)*5) calc(var(--u)*5);opacity:0;animation:sc var(--d) linear var(--s) both}
.p .sc{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:calc(var(--u)*17) calc(var(--u)*6) calc(var(--u)*8);gap:calc(var(--u)*5)}
@keyframes sc{0%{opacity:0}4%{opacity:1}95%{opacity:1}100%{opacity:0}}
.tx{display:grid;gap:calc(var(--u)*1.8);align-content:center;justify-items:start}
.p .tx{align-content:start;gap:calc(var(--u)*2.6)}
.step{display:inline-flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.5) calc(var(--u)*1.5) calc(var(--u)*.5) calc(var(--u)*.6);border-radius:999px;background:#fff;border:1px solid var(--line);font:800 var(--fs) "Alexandria";color:var(--teal2);animation:rise .6s ease both}
.step b{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font:900 1em "Alexandria"}
h2{font:900 var(--h2)/1.3 "Alexandria";color:var(--ink)}
h2 .w{display:inline-block;animation:word .7s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes word{from{opacity:0;transform:translateY(calc(var(--u)*2.4));filter:blur(calc(var(--u)*.6))}to{opacity:1;transform:none;filter:none}}
.mk{position:relative;z-index:0;color:var(--teal2)}
.mk::after{content:"";position:absolute;z-index:-1;right:-.08em;left:-.08em;bottom:.08em;height:.32em;border-radius:.1em;background:rgba(99,226,224,.55);transform-origin:right;animation:mark .8s cubic-bezier(.6,0,.3,1) both;animation-delay:inherit}
@keyframes mark{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lead{font-size:var(--lead);line-height:1.8;color:var(--ink2);animation:rise .8s ease both}
.big{font:900 calc(var(--h2)*.82) "Alexandria";color:var(--ink);direction:ltr;animation:rise .7s ease both}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.45em 1em;border-radius:999px;background:#fff;border:1px solid var(--line);font:800 var(--fs) "IBM Plex Sans Arabic";color:var(--teal2);animation:pop .5s ease both}
.chip img{width:1.4em;height:1.4em;border-radius:.3em}
/* المسرح: عنصر واحد في الوسط كل مرة */
.vs{position:relative;min-height:0;height:100%}
.st{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:var(--gap);opacity:0}
@keyframes stIn{from{opacity:0;transform:translateY(calc(var(--u)*3)) scale(.96)}to{opacity:1;transform:none}}
@keyframes stOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(calc(var(--u)*-2)) scale(.98)}}
/* البطاقة بقالب المنصة */
.cd{width:var(--cw);padding:var(--pad);display:grid;gap:var(--gap);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(10,31,68,.12)}
.ch{display:flex;align-items:center;gap:calc(var(--gap)*.8);padding-bottom:calc(var(--gap)*.8);border-bottom:1px solid #eef1f5}
.ch .ti{flex:none;width:calc(var(--ic)*.8);height:calc(var(--ic)*.8);border-radius:28%;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--teal))}
.ch .ti.wa{background:linear-gradient(135deg,#25D366,#128C7E)}.ch .ti.nv{background:linear-gradient(135deg,#1D3F86,#0B2552)}
.ch .ti svg{width:56%;height:56%}.ch .ti img{width:100%;height:100%;border-radius:28%}
.ch b{display:block;font:800 var(--fh) "Alexandria";color:var(--ink)}.ch small{font-size:var(--fs);color:var(--muted)}
.lb{font:800 var(--fb) "Alexandria";color:var(--ink2)}
.fin{display:flex;align-items:center;gap:calc(var(--gap)*.6);direction:ltr;min-height:calc(var(--fi)*2.2);padding:0 calc(var(--fi)*.5);border-radius:calc(var(--r)*.6);border:calc(var(--u)*.2) solid #c9d6e6;background:#fff;font:700 var(--fi) "Alexandria";color:var(--ink);animation:focus .3s ease both}
@keyframes focus{to{border-color:var(--teal);box-shadow:0 0 0 calc(var(--u)*.5) rgba(10,165,173,.15)}}
.fin .cc{padding:.15em .45em;border-radius:.35em;background:#EEF3F9;color:var(--muted);font-size:.72em}
.fin s{text-decoration:none;display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;animation:typeW 1.3s steps(11,end) both}
@keyframes typeW{from{max-width:0}to{max-width:100%}}
.fin i{width:.6em;height:.6em;border-radius:50%;background:var(--ink);animation:pop .25s ease both}
.btn{position:relative;display:grid;padding:calc(var(--fb)*.75);border-radius:calc(var(--r)*.6);background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font:800 var(--fb) "Alexandria";box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(10,165,173,.35)}
.btn>span{grid-area:1/1;display:flex;justify-content:center;align-items:center;gap:.4em}
.btn .b1{animation:fadeOut .2s ease both}.btn .b2{opacity:0;animation:fadeIn .25s ease both}
.btn.go{animation:press .45s ease both,okbtn .4s ease both}
.btn.gh{background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
@keyframes press{50%{transform:scale(.95);filter:brightness(1.12)}}
@keyframes okbtn{to{background:var(--ok)}}
.okc{justify-self:center;display:inline-flex;align-items:center;gap:.4em;padding:.4em 1.1em;border-radius:999px;background:#EAF8F1;color:var(--ok);font:800 var(--fb) "Alexandria";animation:pop .6s ease both}
.okc.sm{justify-self:start;font-size:var(--fs)}
.rls{display:flex;flex-wrap:wrap;gap:calc(var(--gap)*.5)}
.rl{display:flex;align-items:center;gap:.5em;padding:.45em .8em;border-radius:.6em;background:#F7F9FC;border:1px solid var(--line);font:700 var(--fs) "IBM Plex Sans Arabic";color:var(--muted);animation:rlok .4s ease both}
.rl::before{content:"✓";flex:none;width:1.4em;height:1.4em;border-radius:50%;display:grid;place-items:center;background:#c9d6e6;color:#fff;font:900 .8em sans-serif;animation:rlic .4s ease both;animation-delay:inherit}
@keyframes rlok{to{background:#EAF8F1;border-color:#9fe0c4;color:var(--ok)}}
@keyframes rlic{to{background:var(--ok)}}
.boxes{display:flex;justify-content:center;gap:calc(var(--gap)*.6);direction:ltr}
.boxes i{width:calc(var(--fi)*1.75);height:calc(var(--fi)*2.15);border-radius:calc(var(--r)*.5);background:#fff;border:calc(var(--u)*.2) solid #c9d6e6;display:grid;place-items:center;font:800 calc(var(--fi)*1.15) "Alexandria";font-style:normal;color:var(--ink)}
.boxes i span{display:block;animation:digit .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes digit{from{opacity:0;transform:translateY(-80%) scale(.6)}to{opacity:1;transform:none}}
.boxes.ok i{animation:okb .4s ease both}
@keyframes okb{to{border-color:var(--ok);background:#EAF8F1}}
/* الإصبع */
.tap{position:absolute;z-index:9;left:46%;top:30%;width:calc(var(--fb)*2.6);height:calc(var(--fb)*2.6);opacity:0;animation:tapA 1.1s ease both}
.tap svg{width:100%;height:100%;filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.6) rgba(0,0,0,.3))}
.tap::before{content:"";position:absolute;left:18%;top:-6%;width:60%;aspect-ratio:1;border-radius:50%;border:calc(var(--u)*.3) solid var(--teal);opacity:0;animation:ripple 1.1s ease-out both;animation-delay:inherit}
@keyframes tapA{0%{opacity:0;transform:translate(calc(var(--u)*3),calc(var(--u)*4))}25%{opacity:1;transform:none}45%{transform:scale(.86)}60%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes ripple{0%,40%{opacity:0;transform:scale(.3)}50%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
/* الطبقات والتنبيهات */
.lst{display:grid;gap:var(--gap);width:var(--cw)}
.ly{display:flex;align-items:center;gap:var(--gap);padding:var(--pad);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(10,31,68,.1);animation:slideL .7s cubic-bezier(.2,.9,.3,1.2) both}
.ly .ic{flex:none;width:var(--ic);height:var(--ic);border-radius:28%;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--teal))}
.ly .ic svg{width:55%;height:55%}
.ly b{display:block;font:800 var(--fh) "Alexandria";color:var(--ink)}.ly small{font-size:var(--fs);color:var(--muted)}
.ly .ok{margin-inline-start:auto;flex:none;width:calc(var(--ic)*.55);height:calc(var(--ic)*.55);border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font:900 calc(var(--fs)*1.2) sans-serif;animation:pop .5s ease both}
.ly.ok2 .ic{background:#12795C}.ly.no .ic{background:#B3261E}.ly.ln .ic{background:#06707A}.ly.wr .ic{background:#B9690F}
.ly.nv{position:relative}
.ly .st2{position:absolute;right:calc(var(--ic) + var(--pad) + var(--gap));height:calc(var(--u)*.4);width:42%;top:50%;background:var(--bad);border-radius:9px;transform-origin:right;animation:strike .4s ease both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ly .x{margin-inline-start:auto;padding:.35em .9em;border-radius:999px;background:var(--bad);color:#fff;font:800 var(--fs) "Alexandria";animation:pop .5s ease both}
/* تطبيقا المصادقة */
.apps{display:flex;gap:calc(var(--u)*4);justify-content:center}
.p .apps{gap:calc(var(--u)*7)}
.app{position:relative;display:grid;justify-items:center;gap:calc(var(--gap)*.6);font:800 var(--fb) "IBM Plex Sans Arabic";color:var(--ink2);animation:pop .7s ease both}
.app img{width:calc(var(--ic)*2.4);height:calc(var(--ic)*2.4);border-radius:22%;object-fit:cover;box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(10,31,68,.2)}
.app .tap{left:40%;top:30%}
/* رمز QR حقيقي */
.qrw{position:relative;justify-self:center;width:calc(var(--cw)*.56);aspect-ratio:1;padding:calc(var(--gap)*.6);border-radius:calc(var(--r)*.6);border:1px solid var(--line);background:#fff;overflow:hidden}
.qrw svg{display:block;width:100%;height:100%}
.scanl{position:absolute;left:4%;right:4%;height:calc(var(--u)*.45);background:var(--mint);box-shadow:0 0 calc(var(--u)*2) var(--teal);animation:scan 1.8s ease-in-out both}
@keyframes scan{0%{opacity:0;top:8%}10%{opacity:1}50%{top:88%}90%{opacity:1}100%{opacity:0;top:8%}}
.key{justify-self:center;direction:ltr;font:700 var(--fb) "Alexandria";letter-spacing:.08em;color:var(--ink2);padding:.3em .8em;border-radius:.5em;background:#F2F6FB}
/* Google Authenticator */
.ga .ch b{direction:ltr;text-align:left}.ga .ch b i{font-style:normal;color:#1a73e8}
.ga .ac{display:flex;align-items:center;justify-content:space-between;direction:ltr}
.ga .ac small{display:block;font-size:var(--fs);color:#5f6368}
.ga .code{font:500 calc(var(--fi)*1.9) "Alexandria";color:#1a73e8;letter-spacing:.06em;white-space:nowrap}
.ring2{flex:none;width:calc(var(--fi)*1.3);height:calc(var(--fi)*1.3);border-radius:50%;background:conic-gradient(#1a73e8 var(--pc,100%),#d2e3fc 0);animation:rg 30s linear both}
@property --pc{syntax:"<percentage>";inherits:false;initial-value:100%}
@keyframes rg{from{--pc:100%}to{--pc:0%}}
/* الرقم الإضافي */
.xin{display:flex;align-items:center;gap:.45em;direction:ltr;min-height:calc(var(--fi)*2.2);padding:0 calc(var(--fi)*.5);border-radius:calc(var(--r)*.6);border:calc(var(--u)*.2) solid var(--teal);background:#fff;font-size:var(--fi)}
.xin i{width:.55em;height:.55em;border-radius:50%;background:var(--ink);animation:pop .25s ease both}
/* سؤال الجهاز */
.dv{display:flex;align-items:center;gap:var(--gap)}
.dv .ti{flex:none;width:var(--ic);height:var(--ic);border-radius:28%;display:grid;place-items:center;background:linear-gradient(135deg,#1D3F86,#0B2552)}.dv .ti svg{width:55%;height:55%}
.dv b{font:800 var(--fh)/1.5 "Alexandria";color:var(--ink)}
/* الإشعار (داخل المسرح — لا يغطي الشعار) */
.nt{width:var(--cw);display:flex;gap:var(--gap);align-items:flex-start;padding:var(--pad);border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 calc(var(--u)*1.8) calc(var(--u)*4) rgba(10,31,68,.18)}
.nt img{width:var(--ic);height:var(--ic);border-radius:24%}
.nt small{display:flex;align-items:center;gap:.3em;font-size:var(--fs);color:var(--muted)}.nt b{display:block;font:800 var(--fh)/1.5 "Alexandria";color:var(--ink)}.nt span{font-size:var(--fb);color:var(--ink2);line-height:1.6}
.vb{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
/* واتساب بلا إطار */
.wa{width:var(--cw);border-radius:var(--r);overflow:hidden;background:#efe7de;border:1px solid var(--line);box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(10,31,68,.16)}
.wa .hd{display:flex;align-items:center;gap:var(--gap);padding:calc(var(--pad)*.7) var(--pad);background:var(--wa);color:#fff}
.wa .hd img{width:var(--ic);height:var(--ic);border-radius:50%;background:#fff}
.wa .hd b{display:flex;align-items:center;gap:.3em;font:800 var(--fh) "Alexandria"}.wa .hd small{display:block;font-size:var(--fs);opacity:.9;direction:ltr;text-align:right}
.wa .bd{display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad);min-height:calc(var(--ic)*2.4)}
.sys{align-self:center;display:flex;align-items:center;gap:.4em;background:#fff3c4;color:#54656f;border-radius:.6em;padding:.35em .9em;font-size:var(--fs)}
.sys svg{width:1em;height:1em;fill:currentColor}
.bb{position:relative;align-self:flex-start;max-width:94%;background:#fff;color:#111b21;border-radius:0 .7em .7em .7em;padding:.7em .9em 1.7em;font-size:var(--fb);line-height:1.65;box-shadow:0 1px 1px rgba(0,0,0,.12);animation:bubIn .45s cubic-bezier(.2,.9,.3,1.25) both;transform-origin:right top}
@keyframes bubIn{from{opacity:0;transform:translateY(calc(var(--u)*3)) scale(.85)}to{opacity:1;transform:none}}
.bb em{position:absolute;left:.8em;bottom:.4em;font:500 .62em sans-serif;color:#667781;font-style:normal}
.bb .hl{display:block;margin-top:.4em;padding:.3em .55em;border-radius:.45em;background:#FFF8E6;color:#6B4A07}
.bb .sig{display:block;margin-top:.4em;color:var(--teal2)}
.typ{align-self:flex-start;display:flex;gap:.35em;background:#fff;border-radius:.7em;padding:.75em 1em;font-size:var(--fb);animation:typ 1.3s ease both}
.typ i{width:.5em;height:.5em;border-radius:50%;background:#9aa7b3}
@keyframes typ{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0;display:none}}
